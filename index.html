<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Ícono "A20" oficial de aula20.edu.pe/favicon/, copiado a public/favicon/ (la ruta anterior daba 404). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon/android-icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-icon-180x180.png" />
    <meta name="theme-color" content="#002cff" />
    <!-- description, Open Graph, schema.org y precargas: los agrega vite.config.ts desde src/lib/headTags.ts -->
    <title>Aula 20 · Tú decides a dónde ingresar</title>
    <script>
      // Tema antes del primer pintado, para que no parpadee. Misma regla que resolveTheme (src/lib/theme.ts).
      ;(() => {
        let stored = null
        try {
          stored = localStorage.getItem('aula20-tema')
        } catch {}
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#000a3b' : '#002cff')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
